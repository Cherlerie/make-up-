<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroowgoodBeauty | Inventario</title>
    <link rel="stylesheet" href="index.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div class="container">
        <h1>💄 GroowgoodBeauty <span>inventory</span></h1>
        <div class="subhead">Gestión de maquillaje</div>

        <div class="toolbar">
            <div class="filters">
                <div class="filter-group">
                    <label>Filtrar por marca</label>
                    <input type="text" id="filterMarca" placeholder="Ej: MAC, Fenty" autocomplete="off">
                </div>
                <div class="filter-group">
                    <label>Filtrar por categoría</label>
                    <input type="text" id="filterCategoria" placeholder="Labiales, Bases, etc">
                </div>
                <button class="btn-clear" id="clearFiltersBtn">Limpiar filtros</button>
            </div>
            <button class="btn-add" id="goToAddBtn"> Nuevo producto</button>
        </div>

        <div class="table-wrapper">
            <table id="productTable">
                <thead>
                    <tr>
                        <th>ID</th><th>Nombre</th><th>Marca</th><th>Categoría</th><th>Precio (USD)</th><th>Stock</th><th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr class="empty-row"><td colspan="7">Cargando inventario...</td></tr>
                </tbody>
            </table>
        </div>
        <footer>⚡ API RESTful • Filtros dinámicos • Editar y eliminar en tiempo real</footer>
    </div>
    <div id="toast" class="toast-msg"></div>

    <script src="index.js"></script>
</body>
</html>
