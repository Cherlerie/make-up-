<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroowgoodBeauty | Editar producto</title>
    <link rel="stylesheet" href="editar.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div class="edit-container" id="editContainer">
        <div class="edit-header">
            <h2>✏️ Editar producto</h2>
            <div class="product-id-badge" id="productIdDisplay">Cargando ID...</div>
        </div>
        <div class="edit-body" id="editBodyContent">
            <div class="loading-spinner">🔄 Cargando información del producto...</div>
        </div>
        <footer>Actualiza datos y guarda cambios</footer>
    </div>
    <div id="globalToast" class="global-toast"></div>

    <script src="editar.js"></script>
</body>
</html>
