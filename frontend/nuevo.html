<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroowgoodBeauty | Agregar producto</title>
    <link rel="stylesheet" href="nuevo.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div class="form-card">
        <div class="form-header">
            <h2>Añadir maquillaje</h2>
            <p>Completa los campos para registrar un nuevo producto</p>
        </div>
        <div class="form-body">
            <form id="productForm">
                <div class="form-group">
                    <label>Nombre del producto *</label>
                    <input type="text" id="nombre" placeholder="Ej: Labial Mate Rojo" required>
                </div>
                <div class="row-2col">
                    <div class="form-group">
                        <label>Marca *</label>
                        <input type="text" id="marca" placeholder="MAC, Maybelline..." required>
                    </div>
                    <div class="form-group">
                        <label>Categoría</label>
                        <input type="text" id="categoria" placeholder="Labiales, Bases, Delineadores">
                    </div>
                </div>
                <div class="row-2col">
                    <div class="form-group">
                        <label>Precio (USD) * ≥ 0.01</label>
                        <input type="number" step="0.01" id="precio" placeholder="12.99" required>
                    </div>
                    <div class="form-group">
                        <label>Stock * ≥ 0</label>
                        <input type="number" id="stock" placeholder="cantidad" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Guardar producto</button>
                <button type="button" class="btn-back" id="backToList">← Volver al inventario</button>
            </form>
        </div>
    </div>
    <div id="toastMsg" class="toast-msg"></div>

    <script src="nuevo.js"></script>
</body>
</html>
